[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-debug-agent"
version = "1.0.0"
description = "A command-line Python debugging and error explanation tool"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dbg = "debug_agent.cli:main"

[tool.setuptools.packages.find]
include = ["debug_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]